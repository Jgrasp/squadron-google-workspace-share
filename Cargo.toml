[package]
name = "google_workspace_share"
version = "0.2.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
squadron_extension_api = { git = "https://github.com/akki-team/squadron-extensions" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
